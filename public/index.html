<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok LIVE Printer</title>
<style>
body{background:#101827;color:white;font-family:Arial;padding:18px}
.card{background:#1e293b;padding:18px;border-radius:15px;margin:15px 0}
input,button{width:100%;padding:14px;margin-top:10px;border:0;border-radius:10px;font-size:16px}
input{background:#0f172a;color:white}
button{background:#e11d48;color:white;font-weight:bold}
.event{padding:12px;border-bottom:1px solid #555}
</style>
</head>
<body>
<h2>🎁 TikTok LIVE Printer</h2>
<p>Hesap: @trvler.999</p>
<div class="card">
<h3>Canlı yayına bağlan</h3>
<input id="user" value="trvler.999">
<button onclick="connectLive()">Yayına bağlan</button>
<p id="status">Bağlantı bekleniyor</p>
</div>
<div class="card">
<h3>Canlı etkinlikler</h3>
<div id="events">Henüz etkinlik yok.</div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io();
socket.on("status",s=>{
 document.getElementById("status").textContent=s.live?"Yayına bağlandı":"Bağlı değil";
});
socket.on("event",e=>{
 const d=document.createElement("div");
 d.className="event";
 d.textContent=e.type+" | "+e.user+" | "+e.detail+" | x"+e.count;
 document.getElementById("events").prepend(d);
});
async function connectLive(){
 const username=document.getElementById("user").value;
 document.getElementById("status").textContent="Bağlanılıyor...";
 const r=await fetch("/api/connect",{
 method:"POST",
 headers:{"Content-Type":"application/json"},
 body:JSON.stringify({username})
 });
 const data=await r.json();
 document.getElementById("status").textContent=data.message||data.error;
}
</script>
</body>
</html>
